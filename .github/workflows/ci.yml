name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Setup Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v13
        with:
          use-flakehub: disabled
          use-gha-cache: enabled
      - name: Check Formatting
        run: nix develop --command cargo fmt --check
      - name: Lint
        run: nix develop --command cargo clippy --all-targets --features sqlite,mysql
      - name: Run Tests
        run: nix develop --command cargo test --features sqlite,mysql
      - name: Check Documentation
        run: nix develop --command cargo doc --no-deps --features sqlite,mysql
        env:
          RUSTDOCFLAGS: -D warnings
      # Every driver is behind a Cargo feature, and the combinations do not
      # compile for free: a `cfg` that is right for one is dead code or a
      # missing arm in another. This is the full power set of the three, which
      # is cheap next to the Nix setup this job has already paid for.
      #
      # The empty set is deliberately absent -- it is a `compile_error!`, since
      # with no driver there is no `Dialect` to transpile against. The case
      # below asserts that on purpose rather than leaving it to a reader to
      # notice the gap.
      - name: Check Feature Combinations
        run: |
          nix develop --command bash -c '
            set -euo pipefail
            for features in "postgres" "sqlite" "mysql" \
                            "postgres,sqlite" "postgres,mysql" "sqlite,mysql" \
                            "postgres,sqlite,mysql"; do
              echo "::group::features: [$features]"
              cargo test --no-default-features --features "$features"
              echo "::endgroup::"
            done
          '
      - name: Check No Driver Is Rejected
        run: |
          nix develop --command bash -c '
            if cargo check --no-default-features 2>/dev/null; then
              echo "expected a compile_error with no driver feature enabled"
              exit 1
            fi
          '
  release:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Create Release PR
        id: release
        uses: googleapis/release-please-action@v5
        with:
          manifest-file: .github/config/release-please-manifest.json
          config-file: .github/config/release-please-config.json
          target-branch: main
  # No `build` job: this is a library crate with no binary, so there is nothing
  # to `nix build` and no asset to attach to the release. The crate itself is
  # the artifact, and it goes to crates.io below.
  publish:
    needs: release
    if: ${{ needs.release.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Setup Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v13
        with:
          use-flakehub: disabled
          use-gha-cache: enabled
      - name: Authenticate with Crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish to Crates.io
        run: nix develop --command cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
