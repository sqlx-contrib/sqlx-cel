[package]
name = "sqlx-cel"
version = "0.0.0"
edition = "2024"
# Not a choice: sqlx 0.9 declares it. 0.9 is the floor because `SqlSafeStr` and
# the `Arguments::add<'t, T>` signature are both 0.9.
rust-version = "1.94"
license = "MIT"
description = "Transpiles a CEL expression into a SQL WHERE fragment with bind values, for sqlx."
repository = "https://github.com/sqlx-contrib/sqlx-cel"
keywords = ["cel", "sqlx", "postgres", "sqlite", "filter"]
categories = ["database"]

# Denied rather than warned, because several consumers in this ecosystem deny
# pedantic at the workspace level: a lint this crate tolerates is a lint they
# cannot.
[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[dependencies]
# `chrono` is the only optional cel feature this crate wants. It is not for the
# parser -- nothing under cel's `src/parser/` is gated, and `timestamp('...')`
# reaches us as a `CallExpr` either way. It is for `Value::resolve`, which folds
# closed subtrees like `timestamp('...') - duration('24h')` into one bind value.
# That is also the only way to reach cel's Go-duration parser, which lives in a
# private module.
#
# `regex` (cel's other default) is deliberately off: `matches()` always has a
# column on one side, so it never folds, and we lower it to the dialect's own
# regex operator instead.
cel = { version = "0.14", default-features = false, features = ["chrono"] }
# Not optional. cel is chrono-only, so there is no build of this crate that
# avoids chrono, and the `Value::Timestamp` variant is unconditional.
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
# 0.9 is the floor: `SqlSafeStr` and the `add<'t, T>` signature are both 0.9.
# The latter is what lets `Value` be bound by value out of a temporary.
sqlx = { version = "0.9", default-features = false }

[features]
default = ["postgres"]

# Driver support: each adds a `Dialect` impl plus the `Encode`/`Type` impls for
# `Value` on that driver. At least one is required; with none enabled there is
# no `Dialect` to transpile against.
postgres = ["sqlx/postgres", "sqlx/chrono"]
sqlite = ["sqlx/sqlite", "sqlx/chrono"]
mysql = ["sqlx/mysql", "sqlx/chrono"]

[dev-dependencies]
sqlx = { version = "0.9", default-features = false, features = ["postgres", "sqlite", "mysql", "chrono", "runtime-tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
