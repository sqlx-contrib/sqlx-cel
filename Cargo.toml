[package]
name = "sqlx-cel"
version = "0.0.0"
edition = "2024"
# Not a choice: sqlx 0.9 declares it. See docs/values.md for why 0.9 is the floor.
rust-version = "1.94"
license = "MIT"
description = "Transpiles a CEL expression into a SQL WHERE fragment with bind values, for sqlx."
repository = "https://github.com/sqlx-contrib/sqlx-cel"
keywords = ["cel", "sqlx", "postgres", "sqlite", "filter"]
categories = ["database"]

# Denied rather than warned, because several consumers in this ecosystem deny
# pedantic at the workspace level: a lint this crate tolerates is a lint they
# cannot.
[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[dependencies]
# Parser only -- `Program::compile` does not type-check, which is a design
# constraint rather than a version to wait out. See docs/transpiler.md.
cel = { version = "0.14", default-features = false }
# 0.9 is the floor: `SqlSafeStr` and the `add<'t, T>` signature are both 0.9.
# Optional: with no driver feature on, this crate is a pure CEL -> SQL
# transpiler with no sqlx dependency at all.
sqlx = { version = "0.9", default-features = false, optional = true }
chrono = { version = "0.4", optional = true, default-features = false, features = ["alloc"] }
time = { version = "0.3", optional = true, default-features = false, features = ["parsing"] }

[features]
default = ["chrono", "postgres"]

# Driver support: each adds `Encode`/`Type` impls for `Value` and makes
# `bind_all` available on that driver's queries.
postgres = ["dep:sqlx", "sqlx/postgres"]
sqlite = ["dep:sqlx", "sqlx/sqlite"]
mysql = ["dep:sqlx", "sqlx/mysql"]

# Which type `Value::Timestamp` holds. With both on, `chrono` wins.
chrono = ["dep:chrono", "sqlx?/chrono"]
time = ["dep:time", "sqlx?/time"]

[dev-dependencies]
sqlx = { version = "0.9", default-features = false, features = ["postgres", "sqlite", "mysql", "chrono", "runtime-tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
